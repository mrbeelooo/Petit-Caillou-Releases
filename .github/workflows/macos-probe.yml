name: macOS runner probe
# Test temporaire : mesure si un runner macOS est attribué (arm64 et Intel). À supprimer ensuite.
on:
  push:
    branches: [claude/project-thread-8yr42c]
permissions:
  contents: read
jobs:
  probe-intel:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - run: uname -m && sw_vers
  probe-arm:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - run: uname -m && sw_vers
